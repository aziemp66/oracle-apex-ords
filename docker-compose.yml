services:
  oracle-db:
    build:
      context: ./db
      args:
        BASE_IMAGE: container-registry.oracle.com/database/enterprise:latest
    container_name: oracle-db
    hostname: oracle-db
    ports:
      - "${PORT_DB:-1521}:1521"
    environment:
      - ORACLE_PWD=${DB_PASSWORD}
      - ORACLE_PASSWORD=${DB_PASSWORD}
      - ORACLE_SID=${DB_SID:-ORCLCDB}
      - ORACLE_PDB=${DB_PDB:-ORCLPDB1}
    volumes:
      - oracle_db_data:/opt/oracle/oradata
    restart: unless-stopped

  oracle-ords:
    build:
      context: ./ords
    container_name: oracle-ords
    depends_on:
      - oracle-db
    ports:
      - "${PORT_ORDS:-8080}:8080"
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD}
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=${DB_SERVICE:-ORCLPDB1}
    volumes:
      - oracle_ords_config:/opt/oracle/ords-config
    restart: unless-stopped

volumes:
  oracle_db_data:
    name: oracle_db_data
  oracle_ords_config:
    name: oracle_ords_config