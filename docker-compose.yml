services:
  oracle-db:
    build:
      context: ./db
      args:
        BASE_IMAGE: container-registry.oracle.com/database/enterprise:${DB_VERSION:-23.26.1.0}
        APEX_VERSION: ${APEX_VERSION:-26.2}
    container_name: oracle-db
    hostname: oracle-db
    ports:
      - "${PORT_DB:-1521}:1521"
    environment:
      - ORACLE_PWD=${DB_PASSWORD}
      - ORACLE_PASSWORD=${DB_PASSWORD}
      - ORACLE_SID=${DB_SID:-ORCLCDB}
      - ORACLE_PDB=${DB_PDB:-ORCLPDB1}
      - APEX_VERSION=${APEX_VERSION:-26.2}
    volumes:
      - oracle_db_data:/opt/oracle/oradata
      - ./apex:/opt/oracle/apex
    restart: unless-stopped

  oracle-ords:
    build:
      context: ./ords
      args:
        BASE_IMAGE: container-registry.oracle.com/database/ords:${ORDS_VERSION:-26.3.1}
        APEX_VERSION: ${APEX_VERSION:-26.2}
    container_name: oracle-ords
    hostname: oracle-ords
    depends_on:
      - oracle-db
    ports:
      - "${PORT_ORDS:-8080}:8080"
    environment:
      - DBHOST=oracle-db
      - DBPORT=1521
      - DBSERVICENAME=${DB_SERVICE:-ORCLPDB1}
      - ORACLE_PWD=${DB_PASSWORD}
      - ORACLE_USER_PWD=${DB_PASSWORD}
      - APEX_PWD=${DB_PASSWORD}
      - APEX_VERSION=${APEX_VERSION:-26.2}
    volumes:
      - oracle_ords_config:/etc/ords/config
      - ./apex:/opt/oracle/apex:ro
    restart: unless-stopped

volumes:
  oracle_db_data:
    name: oracle_db_data
  oracle_ords_config:
    name: oracle_ords_config
